<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Datos de la cerveza</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <div class="contenedor">
        <h2>Datos de la cerveza</h2>

        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
            <!-- Campo oculto: si trae ID se actualiza, si viene vacío se inserta -->
            <input type="hidden" th:field="*{idProducto}">

            <div class="campo">
                <label>Nombre</label>
                <input type="text" th:field="*{nombre}">
                <span class="error" th:errors="*{nombre}"></span>
            </div>

            <div class="campo">
                <label>Descripción</label>
                <input type="text" th:field="*{descripcion}">
            </div>

            <div class="campo">
                <label>Precio</label>
                <input type="number" step="0.01" th:field="*{precio}">
                <span class="error" th:errors="*{precio}"></span>
            </div>

            <div class="campo">
                <label>% de alcohol</label>
                <input type="number" step="0.1" th:field="*{porcentajeAlcohol}">
            </div>

            <div class="campo">
                <label>Volumen (ml)</label>
                <input type="number" th:field="*{volumenMl}">
            </div>

            <div class="campo">
                <label>Stock</label>
                <input type="number" th:field="*{stock}">
                <span class="error" th:errors="*{stock}"></span>
            </div>

            <div class="campo">
                <label>Categoría</label>
                <!-- Menú desplegable con las categorías que existen en la base de datos -->
                <select th:field="*{idCategoria}">
                    <option th:each="c : ${categorias}"
                            th:value="${c.idCategoria}"
                            th:text="${c.nombreCategoria}"></option>
                </select>
            </div>

            <div class="botones">
                <button type="submit" class="btn">Guardar</button>
                <a href="/productos" class="btn btn-suave">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
