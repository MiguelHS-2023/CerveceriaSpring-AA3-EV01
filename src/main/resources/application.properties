spring.application.name=CerveceriaSpring

# Conexion a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_cervezas
spring.datasource.username=root

# La contrasena NO se escribe aqui: esta en application-local.properties,
# un archivo que no se sube a Git (ver .gitignore).
spring.config.import=optional:classpath:application-local.properties

# No modificar la estructura de las tablas existentes
spring.jpa.hibernate.ddl-auto=none
